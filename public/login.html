<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>Workspace Console</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b1120;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      text-align: center;
    }
    .subtitle {
      margin: 0 0 20px;
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      margin-bottom: 14px;
    }
    input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
    }
    button {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: #f97316;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #ea580c; }
    button:disabled { opacity: 0.65; cursor: not-allowed; }
    .err {
      display: none;
      margin-bottom: 14px;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 13px;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <h1>Sign In</h1>
    <p class="subtitle">Workspace Console — Authorized Personnel Only</p>
    <div class="err" id="errBox"></div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
    <button type="submit" id="submitBtn">Sign In</button>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) return;
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          errBox.textContent = data.error || 'Authentication failed';
          errBox.classList.add('show');
          document.getElementById('password').value = '';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }
        window.location.reload();
      } catch {
        errBox.textContent = 'Connection error. Please try again.';
        errBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
