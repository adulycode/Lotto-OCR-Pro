<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2922" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="2" />

  <!-- Subtle ticket silhouette in background -->
  <g transform="rotate(-14 32 32)">
    <path d="M12 19 h40 v8 a4 4 0 0 0 0 8 v8 h-40 v-8 a4 4 0 0 0 0 -8 z" fill="url(#ticketGrad)" opacity="0.24" stroke="#fbbf24" stroke-width="1.6" />
    <line x1="23" y1="22" x2="23" y2="40" stroke="#fde68a" stroke-width="1.4" stroke-dasharray="2.5 2.5" opacity="0.55" />
  </g>

  <!-- Glossy golden lottery ball -->
  <circle cx="32" cy="33" r="20" fill="url(#ballGrad)" stroke="#fef3c7" stroke-width="1.5" />
  <circle cx="32" cy="33" r="14" fill="#fffbeb" />

  <!-- Lucky number -->
  <text x="32" y="39.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="18.5" fill="#92400e" letter-spacing="-0.5">88</text>

  <!-- Sparkle -->
  <path d="M50 11 L51.6 14.4 L55 16 L51.6 17.6 L50 21 L48.4 17.6 L45 16 L48.4 14.4 Z" fill="#fde047" />
</svg>
