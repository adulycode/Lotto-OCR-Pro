server {
    listen 80;
    listen [::]:80;
    server_name lotto.eflworkspace.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lotto.eflworkspace.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/eflworkspace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eflworkspace.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30M;

    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Robots-Tag;

    # Drop search engine crawlers, AI scrapers, and vulnerability scanners immediately
    if ($http_user_agent ~* (Googlebot|Bingbot|Baiduspider|Yandex|DuckDuckBot|Slurp|Sogou|Exabot|facebookexternalhit|AhrefsBot|SemrushBot|MJ12bot|DotBot|PetalBot|Bytespider|GPTBot|CCBot|Shodan|Censys|zgrab|masscan|sqlmap|nikto|nmap|Scrapy|DirBuster|gobuster|ffuf)) {
        return 444;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    location ~ /\.(?!well-known) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
